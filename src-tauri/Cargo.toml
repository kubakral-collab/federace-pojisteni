[package]
name = "pojisteni-klienti"
version = "0.18.0"
description = "Pojištění — funkční parita původní Access aplikace"
authors = ["Federace pojištění"]
edition = "2021"

[lib]
name = "pojisteni_klienti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
chrono = "0.4"
sha2 = "0.10"
rfd = "0.15"
printpdf = { version = "0.7", features = ["embedded_images"] }
deunicode = "1"
tauri-plugin-process = "2"
zip = "4"
tempfile = "3"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
image = { version = "0.24", default-features = false, features = ["jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
